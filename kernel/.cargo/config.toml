[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = [
    "-C", "linker=ld.bfd",
    "-C", "linker-flavor=ld",
    "-C", "link-arg=-Tlinker.ld",
    "-C", "relocation-model=static",
    "-C", "code-model=kernel",
    "-C", "force-frame-pointers=yes",
]
# `cargo run` / `cargo test` hand the built ELF to this script (build ISO + start QEMU)
runner = "../scripts/run-qemu.sh"
