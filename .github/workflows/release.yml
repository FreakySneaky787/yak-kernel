# When a GitHub release is published: build the release files from its tag, boot them once
# (scripts/check-release.py, BIOS and UEFI) and attach them to the release - so anybody can run
# YAK with nothing but QEMU (README.md, "Run a release without building").
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build the files for, e.g. v1.0.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  CARGO_TERM_COLOR: always

jobs:
  files:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf xorriso dosfstools mtools \
            make gcc binutils git python3
      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install
      - name: Build and boot the release files
        run: make release
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" build/release/* --clobber
