[package]
name = "user"
version = "1.0.0-rc.1"
edition = "2024"
license = "GPL-3.0-or-later"

# The runtime library every program links against (syscalls, print!, _start)
[lib]
name = "ulib"
test = false
bench = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
