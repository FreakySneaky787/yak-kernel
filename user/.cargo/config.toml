[build]
target = "x86_64-unknown-none"

# Like the kernel (GNU ld, static, no PIE), but linked low at 0x40_0000:
# the "small" code model instead of the kernel's -2 GiB one.
[target.x86_64-unknown-none]
rustflags = [
    "-C", "linker=ld.bfd",
    "-C", "linker-flavor=ld",
    "-C", "link-arg=-Tlinker.ld",
    "-C", "relocation-model=static",
    "-C", "code-model=small",
]
